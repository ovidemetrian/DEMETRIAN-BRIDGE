<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="1000" fill="#ffffff"/>
  <rect x="12" y="12" width="976" height="976" fill="none" stroke="#1d4ed8" stroke-width="6"/>
  <text x="40" y="70" font-size="38" font-weight="800" fill="#111"><tspan fill="#dc2626">CONCEPT 1977</tspan> · DEMETRIAN BRIDGE</text>
  <text x="40" y="104" font-size="24" fill="#1d4ed8">Matrix of sound · principle schematic</text>
  <line x1="50" y1="460" x2="180" y2="460" stroke="#111" stroke-width="4" stroke-dasharray="12 8"/>
  <line x1="50" y1="540" x2="180" y2="540" stroke="#111" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="50" y="448" font-size="26" font-weight="700">IN −</text>
  <text x="50" y="580" font-size="26" font-weight="700">IN +</text>
  <polygon points="180,410 180,590 340,500" fill="#A8D4FF" stroke="#111" stroke-width="4"/>
  <text x="200" y="510" font-size="30" font-weight="800">A1</text>
